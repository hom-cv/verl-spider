tools:
  - class_name: spider_trace.tool.SQLiteTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: execute_sql
        description: Execute one read-only SQLite query against this question's database. Returns a text table or error inside observation tags, subject to the row and character limits specified in the task.
        parameters:
          type: object
          properties:
            sql:
              type: string
              description: A single SELECT or WITH query.
          required: [sql]
          additionalProperties: false
